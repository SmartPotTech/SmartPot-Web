version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # La web corre en Node 24 LTS: los tipos y la imagen de Node 25+ no se proponen.
    ignore:
      - dependency-name: "@types/node"
        versions: [ ">= 25" ]
    groups:
      react:
        patterns: [ "react", "react-dom", "@types/react", "@types/react-dom" ]
      lint:
        patterns: [ "eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*" ]
      test:
        patterns: [ "vitest", "@testing-library/*", "jsdom" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "node"
        versions: [ ">= 25" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
