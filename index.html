                        {
                            "@type": "Question",
                            "name": "¿Qué es SmartPot?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Una plataforma abierta para monitorear y automatizar cultivos hidropónicos en maceta, tubos NFT, torre o balsa. Un ESP32 envía sus lecturas por MQTT, o SmartPot las simula en un cultivo virtual; la aplicación las muestra en vivo, las analiza y puede controlar la bomba, la luz, el ventilador, el humidificador y los dosificadores."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "¿Necesito hardware?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "No. Puedes crear un cultivo virtual que SmartPot simula, o uno real con el firmware simulado en Wokwi o grabado en una placa ESP32 con sensores. Al crearlo eliges real o virtual, y eso no cambia después."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "¿Qué cultivos soporta?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Lechuga, tomate, fresa, albahaca, espinaca y pimentón, cada uno con sus rangos ideales de temperatura, humedad, luz, pH, nutrientes y humedad del sustrato."
                            }
                        },
                        {
                            "@type": "Question",
                            "name": "¿Cómo decide el asistente?",
                            "acceptedAnswer": {
                                "@type": "Answer",
                                "text": "Combina un sistema experto con reglas de agronomía, lógica difusa para el índice de salud, modelos de aprendizaje automático y un agente reactivo. Cada recomendación muestra las reglas y la certeza que la respaldan."
                            }
                        },

                                "@type": "Answer",

                            }
